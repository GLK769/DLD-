<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="460" viewBox="0 0 1500 460">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#263238"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #17202a; }
      .label { font: 700 18px Arial, sans-serif; fill: #17202a; text-anchor: middle; }
      .small { font: 15px Arial, sans-serif; fill: #37474f; text-anchor: middle; }
      .arrow { stroke: #263238; stroke-width: 3; marker-end: url(#arrow); }
      .edge { font: 14px Arial, sans-serif; fill: #455a64; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1500" height="460" fill="#ffffff"/>
  <text x="750" y="52" class="title" text-anchor="middle">Convolutional Encoder and Viterbi Decoder over a Noisy Channel</text>

  <rect x="45" y="185" width="150" height="80" rx="8" fill="#e3f2fd" stroke="#2f6fbe" stroke-width="3"/>
  <text x="120" y="218" class="label">Input Data</text>
  <text x="120" y="244" class="small">Serial bits</text>

  <rect x="285" y="165" width="190" height="120" rx="8" fill="#d8eafe" stroke="#2f6fbe" stroke-width="3"/>
  <text x="380" y="211" class="label">Convolutional</text>
  <text x="380" y="236" class="label">Encoder</text>
  <text x="380" y="262" class="small">Rate 1/2, K = 3</text>

  <rect x="565" y="165" width="190" height="120" rx="8" fill="#fce0e6" stroke="#b94762" stroke-width="3"/>
  <text x="660" y="211" class="label">Controlled</text>
  <text x="660" y="236" class="label">Noisy Channel</text>
  <text x="660" y="262" class="small">Bit-flip injection</text>

  <rect x="845" y="125" width="245" height="200" rx="8" fill="#e3f4e7" stroke="#39834c" stroke-width="3"/>
  <text x="968" y="163" class="label">Viterbi Decoder</text>
  <text x="968" y="197" class="small">Branch Metric Unit</text>
  <text x="968" y="224" class="small">ACS and Path Metrics</text>
  <text x="968" y="251" class="small">Survivor Memory</text>
  <text x="968" y="278" class="small">Traceback Unit</text>

  <rect x="1180" y="185" width="210" height="80" rx="8" fill="#fff0cc" stroke="#b57a13" stroke-width="3"/>
  <text x="1285" y="218" class="label">Recovered Data</text>
  <text x="1285" y="244" class="small">Decoded bits</text>

  <line x1="195" y1="225" x2="285" y2="225" class="arrow"/>
  <text x="240" y="205" class="edge">Input bit</text>
  <line x1="475" y1="225" x2="565" y2="225" class="arrow"/>
  <text x="520" y="205" class="edge">Encoded pair</text>
  <line x1="755" y1="225" x2="845" y2="225" class="arrow"/>
  <text x="800" y="205" class="edge">Received pair</text>
  <line x1="1090" y1="225" x2="1180" y2="225" class="arrow"/>
  <text x="1135" y="205" class="edge">Decoded bit</text>
</svg>
